<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CKAD Practice — Matt's Dojo</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3248;
    --accent: #326CE5;
    --accent2: #5b8df5;
    --green: #2ecc71;
    --red: #e74c3c;
    --yellow: #f39c12;
    --text: #e2e8f0;
    --muted: #8892a4;
    --code-bg: #111318;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Layout */
  .app { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 56px 1fr; height: 100vh; }
  .topbar { grid-column: 1 / -1; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 12px; z-index: 10; }
  .topbar h1 { font-size: 15px; font-weight: 700; color: var(--accent2); }
  .topbar .k8s-logo { font-size: 20px; }
  .topbar .score-badge { margin-left: auto; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px; font-size: 12px; color: var(--muted); }
  .topbar .score-badge span { color: var(--green); font-weight: 700; }

  /* Sidebar */
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 0; }
  .sidebar-section { padding: 6px 16px 4px; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }
  .topic-btn { display: flex; align-items: center; width: 100%; padding: 8px 16px; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 13px; text-align: left; gap: 8px; transition: all .15s; }
  .topic-btn:hover { background: var(--surface2); color: var(--text); }
  .topic-btn.active { background: rgba(50,108,229,.15); color: var(--accent2); border-right: 2px solid var(--accent); }
  .topic-btn .count { margin-left: auto; font-size: 11px; background: var(--surface2); border-radius: 10px; padding: 1px 7px; }
  .topic-btn.active .count { background: rgba(50,108,229,.3); color: var(--accent2); }
  .progress-mini { height: 3px; background: var(--border); border-radius: 2px; margin: 0 16px 8px; overflow: hidden; }
  .progress-mini-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
  .failed-badge { font-size: 9px; background: rgba(231,76,60,.2); color: var(--red); border-radius: 3px; padding: 1px 5px; font-weight: 700; }

  /* Main */
  .main { overflow-y: auto; padding: 24px; }
  .topic-header { margin-bottom: 20px; }
  .topic-header h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .topic-header .docs-link { font-size: 12px; color: var(--accent2); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .topic-header .docs-link:hover { text-decoration: underline; }
  .topic-header .subtitle { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* Docs Nav panel */
  .docs-nav { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; }
  .docs-nav h3 { font-size: 12px; font-weight: 700; color: var(--accent2); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 10px; }
  .docs-nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .docs-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  .docs-item .path { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
  .docs-item a { font-size: 12px; color: var(--accent2); text-decoration: none; }
  .docs-item a:hover { text-decoration: underline; }
  .docs-item .search-tip { font-size: 10px; color: var(--muted); margin-top: 3px; font-style: italic; }

  /* Question cards */
  .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .q-card.failed { border-left: 3px solid var(--red); }
  .q-card.known { border-left: 3px solid var(--green); opacity: .6; }
  .q-header { padding: 14px 16px; display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
  .q-num { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface2); border-radius: 4px; padding: 2px 7px; flex-shrink: 0; margin-top: 1px; }
  .q-title { flex: 1; font-size: 14px; font-weight: 600; line-height: 1.4; }
  .q-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
  .tag-fail { background: rgba(231,76,60,.2); color: var(--red); }
  .tag-hard { background: rgba(243,156,18,.15); color: var(--yellow); }
  .tag-med  { background: rgba(50,108,229,.15); color: var(--accent2); }
  .tag-easy { background: rgba(46,204,113,.15); color: var(--green); }
  .chevron { color: var(--muted); transition: transform .2s; font-size: 12px; padding-top: 2px; }
  .q-card.open .chevron { transform: rotate(90deg); }
  .q-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
  .q-card.open .q-body { display: block; }
  .q-scenario { font-size: 13px; color: var(--text); line-height: 1.65; padding: 12px 0 10px; }
  .q-scenario code { background: var(--code-bg); border: 1px solid var(--border); padding: 1px 5px; border-radius: 3px; font-family: var(--font-mono); font-size: 12px; color: #a8d8ea; }

  /* Hint panel */
  .hint-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--accent); color: var(--accent2); border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; margin-bottom: 8px; transition: all .15s; }
  .hint-btn:hover { background: rgba(50,108,229,.15); }
  .hint-panel { background: #0d1a3a; border: 1px solid var(--accent); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; display: none; }
  .hint-panel.show { display: block; }
  .hint-panel h4 { font-size: 11px; font-weight: 700; color: var(--accent2); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px; }
  .hint-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; font-size: 12px; }
  .hint-label { color: var(--muted); min-width: 70px; flex-shrink: 0; }
  .hint-row a { color: var(--accent2); text-decoration: none; word-break: break-all; }
  .hint-row a:hover { text-decoration: underline; }
  .hint-search { font-style: italic; color: #7ab3e0; }

  /* Answer panel */
  .answer-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(46,204,113,.1); border: 1px solid var(--green); color: var(--green); border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; margin-bottom: 8px; margin-left: 8px; transition: all .15s; }
  .answer-btn:hover { background: rgba(46,204,113,.2); }
  .answer-panel { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; display: none; }
  .answer-panel.show { display: block; }
  .answer-panel h4 { font-size: 11px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 10px; }
  .answer-panel .explanation { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
  .answer-panel .explanation .highlight { color: var(--yellow); font-weight: 700; }
  pre { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6; color: #cdd6f4; overflow-x: auto; white-space: pre; }
  .yaml-comment { color: #6c7086; }
  .yaml-key { color: #89b4fa; }
  .yaml-val { color: #a6e3a1; }
  .yaml-str { color: #f5c2e7; }
  .yaml-important { color: #f38ba8; font-weight: 700; }

  /* Mark buttons */
  .mark-row { display: flex; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .mark-known { background: rgba(46,204,113,.1); border: 1px solid var(--green); color: var(--green); border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .mark-known:hover { background: rgba(46,204,113,.25); }
  .mark-review { background: rgba(243,156,18,.1); border: 1px solid var(--yellow); color: var(--yellow); border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .mark-review:hover { background: rgba(243,156,18,.2); }
  .mark-status { font-size: 11px; color: var(--muted); margin-left: auto; align-self: center; }

  /* Home / overview */
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .overview-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; cursor: pointer; transition: all .15s; }
  .overview-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .overview-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .overview-card .oc-meta { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
  .overview-card .oc-progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .overview-card .oc-fill { height: 100%; border-radius: 2px; transition: width .3s; }
  .overview-card .oc-stats { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .alert-box { background: rgba(231,76,60,.1); border: 1px solid rgba(231,76,60,.4); border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px; line-height: 1.6; }
  .alert-box strong { color: var(--red); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); border-radius: 20px; padding: 5px 13px; font-size: 12px; cursor: pointer; transition: all .15s; }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: rgba(50,108,229,.2); border-color: var(--accent); color: var(--accent2); }
</style>
</head>
<body>
<div class="app">
  <!-- Top bar -->
  <div class="topbar">
    <span class="k8s-logo">⎈</span>
    <h1>CKAD Practice Dojo</h1>
    <div style="font-size:12px;color:var(--muted);margin-left:8px">Matt's exam is Friday 5 PM</div>
    <div class="score-badge">Known: <span id="known-count">0</span> / <span id="total-count">0</span></div>
  </div>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-section">Navigation</div>
    <button class="topic-btn active" onclick="showTopic('home')" id="nav-home">
      <span>🏠</span> Overview
    </button>
    <div class="sidebar-section" style="margin-top:8px">CKAD Topics</div>
    <!-- dynamically filled -->
  </nav>

  <!-- Main -->
  <main class="main" id="main">
    <!-- dynamically filled -->
  </main>
</div>

<script>
// ────────────────────────────────────────────────────────────────────────────
// DATA
// ────────────────────────────────────────────────────────────────────────────
const TOPICS = [
  {
    id: 'network-policy',
    label: 'Network Policies',
    icon: '🔒',
    docsUrl: 'https://kubernetes.io/docs/concepts/services-networking/network-policies/',
    docsPath: 'Concepts → Services, LB & Networking → Network Policies',
    searchTip: 'Search "network policy" — look for the podSelector + ingress/egress spec example',
    subtitle: 'You deleted a NetPol instead of adding an allow rule. Never again.',
    docLinks: [
      { label: 'NetworkPolicy concept', url: 'https://kubernetes.io/docs/concepts/services-networking/network-policies/', tip: 'Search: networkpolicy podSelector' },
      { label: 'Declare policy', url: 'https://kubernetes.io/docs/tasks/administer-cluster/declare-network-policy/', tip: 'Search: declare network policy' },
    ]
  },
  {
    id: 'ingress',
    label: 'Ingress',
    icon: '🌐',
    docsUrl: 'https://kubernetes.io/docs/concepts/services-networking/ingress/',
    docsPath: 'Concepts → Services, LB & Networking → Ingress',
    searchTip: 'Search "ingress" — the spec.rules[].http.paths[].backend.service.port section',
    subtitle: 'You used the NodePort (30093) instead of the Service ClusterIP port (8080).',
    docLinks: [
      { label: 'Ingress concept', url: 'https://kubernetes.io/docs/concepts/services-networking/ingress/', tip: 'Find: spec.rules, backend.service.port' },
      { label: 'IngressClass', url: 'https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class', tip: 'Search: ingressClassName' },
      { label: 'kubectl create ingress', url: 'https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_ingress/', tip: 'Imperative create command' },
    ]
  },
  {
    id: 'cronjob',
    label: 'CronJobs & Jobs',
    icon: '⏱',
    docsUrl: 'https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/',
    docsPath: 'Concepts → Workloads → Workload Management → CronJob',
    searchTip: 'Search "cronjob" — find jobTemplate.spec section for activeDeadlineSeconds',
    subtitle: 'activeDeadlineSeconds and backoffLimit go under jobTemplate.spec — NOT spec.',
    docLinks: [
      { label: 'CronJob', url: 'https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/', tip: 'Look for jobTemplate.spec' },
      { label: 'Job', url: 'https://kubernetes.io/docs/concepts/workloads/controllers/job/', tip: 'backoffLimit, activeDeadlineSeconds' },
      { label: 'kubectl create cronjob', url: 'https://kubernetes.io/docs/reference/kubectl/generated/kubectl_create/kubectl_create_cronjob/', tip: 'Imperative command' },
    ]
  },
  {
    id: 'observability',
    label: 'Observability',
    icon: '👁',
    docsUrl: 'https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/',
    docsPath: 'Tasks → Configure Pods → Configure Liveness, Readiness, Startup Probes',
    searchTip: 'Search "liveness probe" — note the 3 types: exec, httpGet, tcpSocket',
    subtitle: 'Lowest scoring CKAD domain. Probe types, kubectl top, log redirection.',
    docLinks: [
      { label: 'Liveness/Readiness probes', url: 'https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/', tip: 'All 3 probe types here' },
      { label: 'kubectl logs', url: 'https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/', tip: 'Search: kubectl logs' },
      { label: 'kubectl top', url: 'https://kubernetes.io/docs/reference/kubectl/generated/kubectl_top/', tip: 'kubectl top pods --sort-by' },
      { label: 'Debug pods', url: 'https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/', tip: 'Events and describe patterns' },
    ]
  },
  {
    id: 'design-build',
    label: 'App Design & Build',
    icon: '🏗',
    docsUrl: 'https://kubernetes.io/docs/concepts/workloads/pods/init-containers/',
    docsPath: 'Concepts → Workloads → Pods → Init Containers',
    searchTip: 'Search "sidecar" or "init container" — look at spec.initContainers',
    subtitle: 'Multi-container patterns, init containers, sidecars, CRDs, Security Contexts.',
    docLinks: [
      { label: 'Init containers', url: 'https://kubernetes.io/docs/concepts/workloads/pods/init-containers/', tip: 'spec.initContainers' },
      { label: 'Sidecar containers', url: 'https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/', tip: 'restartPolicy: Always in initContainers' },
      { label: 'ConfigMaps', url: 'https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/', tip: 'envFrom, env.valueFrom' },
      { label: 'Secrets', url: 'https://kubernetes.io/docs/concepts/configuration/secret/', tip: 'secretKeyRef, volume mount' },
      { label: 'Security Context', url: 'https://kubernetes.io/docs/tasks/configure-pod-container/security-context/', tip: 'capabilities, runAsUser' },
      { label: 'CRDs', url: 'https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/', tip: 'openAPIV3Schema, subresources' },
    ]
  },
  {
    id: 'deployment',
    label: 'App Deployment',
    icon: '🚀',
    docsUrl: 'https://kubernetes.io/docs/concepts/workloads/controllers/deployment/',
    docsPath: 'Concepts → Workloads → Workload Management → Deployments',
    searchTip: 'Search "rollingupdate" — strategy.rollingUpdate.maxSurge/maxUnavailable',
    subtitle: 'RollingUpdate, blue/green, Helm, kubectl rollout.',
    docLinks: [
      { label: 'Deployment', url: 'https://kubernetes.io/docs/concepts/workloads/controllers/deployment/', tip: 'rollingUpdate strategy, rollback' },
      { label: 'kubectl rollout', url: 'https://kubernetes.io/docs/reference/kubectl/generated/kubectl_rollout/', tip: 'undo, history, status' },
      { label: 'Helm quickstart', url: 'https://helm.sh/docs/intro/quickstart/', tip: 'helm install, lint, ls' },
      { label: 'RBAC', url: 'https://kubernetes.io/docs/reference/access-authn-authz/rbac/', tip: 'Role, ClusterRole, non-resource URLs' },
    ]
  },
];

// ── QUESTIONS ────────────────────────────────────────────────────────────────
const QUESTIONS = [
  // ── NETWORK POLICY ────────────────────────────────────────────────────────
  {
    id: 'np-1', topic: 'network-policy', difficulty: 'fail',
    title: 'Fix failed connectivity: allow webapp-color → secure-pod on TCP 80',
    scenario: `A <code>default-deny</code> NetworkPolicy exists in the <code>default</code> namespace. Pods named <code>secure-pod</code> (label <code>run: secure-pod</code>) cannot receive traffic. Create a NetworkPolicy that allows the pod <code>webapp-color</code> (label <code>name: webapp-color</code>) to reach <code>secure-pod</code> on TCP port 80. Do NOT delete the existing policy.`,
    hint: {
      url: 'https://kubernetes.io/docs/concepts/services-networking/network-policies/',
      path: 'Concepts → Services, LB & Networking → Network Policies',
      tip: 'Find the "podSelector" + "ingress.from.podSelector" example. The key is spec.podSelector (who this applies to) vs ingress.from.podSelector (who is allowed in).'
    },
    answer: {
      explanation: `The existing default-deny blocks everything. You need to <span class="highlight">add</span> a new allow policy — never delete the deny. The podSelector targets secure-pod. The ingress.from.podSelector allows webapp-color.`,
      yaml: `apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webapp-to-secure
  namespace: default
spec:
  podSelector:
    matchLabels:
      run: secure-pod        # THIS policy applies to pods with this label
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          name: webapp-color # allow traffic FROM pods with this label
    ports:
    - protocol: TCP
      port: 80`
    }
  },
  {
    id: 'np-2', topic: 'network-policy', difficulty: 'hard',
    title: 'Edit existing NetworkPolicy to add a new allowed source',
    scenario: `A NetworkPolicy <code>netpol-ckad13-svcn</code> already allows ingress from pods with label <code>tier: server</code>. Edit it to ALSO allow ingress from pods with label <code>access: allowed</code>. Do not change or remove the existing rule.`,
    hint: {
      url: 'https://kubernetes.io/docs/concepts/services-networking/network-policies/#networkpolicy-resource',
      path: 'Concepts → Network Policies → NetworkPolicy resource',
      tip: 'In the ingress.from list, each separate dash (-) item is an OR condition. Add a new - podSelector item to add another allowed source.'
    },
    answer: {
      explanation: `In the <code>ingress.from</code> list, items at the same dash level are OR conditions. Just add a second <code>- podSelector</code> entry.`,
      yaml: `spec:
  podSelector:
    matchLabels:
      app: kk-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: server         # existing rule — do not remove
    - podSelector:             # ADD THIS (OR condition)
        matchLabels:
          access: allowed`
    }
  },
  {
    id: 'np-3', topic: 'network-policy', difficulty: 'medium',
    title: 'Create NetworkPolicy: allow only pods with label access=redis to reach a Redis deployment on port 6379',
    scenario: `A <code>redis</code> Deployment (label <code>app: redis</code>) exists. Create a NetworkPolicy named <code>redis-access</code> that allows only pods with label <code>access: redis</code> to reach it on TCP 6379. All other ingress to Redis pods should be blocked.`,
    hint: {
      url: 'https://kubernetes.io/docs/concepts/services-networking/network-policies/',
      path: 'Concepts → Network Policies',
      tip: 'podSelector on the policy = which pods are protected (app: redis). ingress.from.podSelector = who can reach them (access: redis). policyTypes must include Ingress.'
    },
    answer: {
      explanation: `The policy's podSelector must match the Redis pods (app: redis, NOT role: redis — check the actual pod labels). The ingress from rule uses access: redis.`,
      yaml: `apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-access
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: redis             # protects pods with this label
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          access: redis      # only these pods can connect
    ports:
    - protocol: TCP
      port: 6379`
    }
  },
  {
    id: 'np-4', topic: 'network-policy', difficulty: 'hard',
    title: 'Add Egress rule allowing DNS but not breaking existing ingress',
    scenario: `Pods with label <code>app: backend</code> need to reach a database (label <code>app: db</code>) on port 5432. Add an Egress NetworkPolicy. Make sure pods can still resolve DNS (UDP/TCP port 53).`,
    hint: {
      url: 'https://kubernetes.io/docs/concepts/services-networking/network-policies/#egress',
      path: 'Concepts → Network Policies → Egress section',
      tip: 'Add TWO egress rules: one to the DB pod on 5432, and one with no podSelector but ports: [{port: 53, protocol: UDP}] for DNS. Without the DNS rule, pods cannot resolve service names.'
    },
    answer: {
      explanation: `<span class="highlight">DNS trap:</span> Once you add an Egress policyType, ALL egress is blocked except what you explicitly allow. Always add UDP 53 for DNS.`,
      yaml: `apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-egress
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: db
    ports:
    - protocol: TCP
      port: 5432
  - ports:               # Allow DNS — ALWAYS include this!
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53`

// ────────────────────────────────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────────────────────────────────
let currentTopic = 'home';
let filterMode   = 'all';
const state = JSON.parse(localStorage.getItem('ckad-state') || '{}');

function saveState() {
  localStorage.setItem('ckad-state', JSON.stringify(state));
  updateScoreBadge();
  renderSidebar();
}

function markCard(id, val) {
  state[id] = val;
  saveState();
  renderMain();
}

function getTopicProgress(topicId) {
  const qs = QUESTIONS.filter(q => q.topic === topicId);
  const known = qs.filter(q => state[q.id] === 'known').length;
  return { total: qs.length, known };
}

function updateScoreBadge() {
  const known = QUESTIONS.filter(q => state[q.id] === 'known').length;
  document.getElementById('known-count').textContent = known;
  document.getElementById('total-count').textContent = QUESTIONS.length;
}

// ────────────────────────────────────────────────────────────────────────────
// RENDER SIDEBAR
// ────────────────────────────────────────────────────────────────────────────
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  // Keep static top
  const existing = sidebar.innerHTML;
  const start = existing.indexOf('<div class="sidebar-section" style="margin-top:8px">');
  const staticPart = existing.substring(0, start);

  let html = staticPart + '<div class="sidebar-section" style="margin-top:8px">CKAD Topics</div>';
  TOPICS.forEach(t => {
    const prog = getTopicProgress(t.id);
    const pct  = prog.total ? Math.round(prog.known / prog.total * 100) : 0;
    const failCount = QUESTIONS.filter(q => q.topic === t.id && q.difficulty === 'fail').length;
    html += `
      <button class="topic-btn ${currentTopic === t.id ? 'active' : ''}" onclick="showTopic('${t.id}')" id="nav-${t.id}">
        <span>${t.icon}</span> ${t.label}
        ${failCount ? `<span class="failed-badge">FAILED ${failCount}x</span>` : ''}
        <span class="count">${prog.known}/${prog.total}</span>
      </button>
      <div class="progress-mini"><div class="progress-mini-fill" style="width:${pct}%"></div></div>`;
  });
  sidebar.innerHTML = html;
}

// ────────────────────────────────────────────────────────────────────────────
// RENDER MAIN
// ────────────────────────────────────────────────────────────────────────────
function showTopic(id) {
  currentTopic = id;
  filterMode = 'all';
  renderSidebar();
  renderMain();
  document.getElementById('main').scrollTop = 0;
}

function renderMain() {
  const main = document.getElementById('main');
  if (currentTopic === 'home') {
    renderHome(main); return;
  }
  const topic = TOPICS.find(t => t.id === currentTopic);
  if (!topic) return;
  let qs = QUESTIONS.filter(q => q.topic === currentTopic);
  if (filterMode === 'failed')  qs = qs.filter(q => q.difficulty === 'fail');
  if (filterMode === 'unknown') qs = qs.filter(q => state[q.id] !== 'known');
  if (filterMode === 'known')   qs = qs.filter(q => state[q.id] === 'known');

  let html = `
    <div class="topic-header">
      <h2>${topic.icon} ${topic.label}</h2>
      <div class="subtitle">${topic.subtitle}</div>
    </div>
    <div class="docs-nav">
      <h3>📖 Find this in the Docs</h3>
      <div class="docs-nav-grid">`;
  topic.docLinks.forEach(dl => {
    html += `<div class="docs-item">
      <div class="path">${topic.docsPath}</div>
      <a href="${dl.url}" target="_blank">↗ ${dl.label}</a>
      <div class="search-tip">💡 ${dl.tip}</div>
    </div>`;
  });
  html += `</div></div>
    <div class="filter-row">
      <button class="filter-btn ${filterMode==='all'?'active':''}" onclick="setFilter('all')">All (${QUESTIONS.filter(q=>q.topic===currentTopic).length})</button>
      <button class="filter-btn ${filterMode==='failed'?'active':''}" onclick="setFilter('failed')" style="color:var(--red)">Failed (${QUESTIONS.filter(q=>q.topic===currentTopic&&q.difficulty==='fail').length})</button>
      <button class="filter-btn ${filterMode==='unknown'?'active':''}" onclick="setFilter('unknown')">Needs Practice (${QUESTIONS.filter(q=>q.topic===currentTopic&&state[q.id]!=='known').length})</button>
      <button class="filter-btn ${filterMode==='known'?'active':''}" onclick="setFilter('known')" style="color:var(--green)">Known ✓ (${QUESTIONS.filter(q=>q.topic===currentTopic&&state[q.id]==='known').length})</button>
    </div>`;

  if (qs.length === 0) {
    html += `<div class="empty-state"><div class="icon">✅</div><p>No questions in this filter.</p></div>`;
  } else {
    qs.forEach((q, i) => {
      const isKnown = state[q.id] === 'known';
      const needsReview = state[q.id] === 'review';
      const statusText = isKnown ? '✅ Marked as known' : needsReview ? '⚠ Needs review' : '';
      html += `
      <div class="q-card ${q.difficulty === 'fail' ? 'failed' : ''} ${isKnown ? 'known' : ''}" id="card-${q.id}">
        <div class="q-header" onclick="toggleCard('${q.id}')">
          <span class="q-num">Q${i+1}</span>
          <span class="q-title">${q.title}</span>
          <span class="q-meta">
            ${q.difficulty === 'fail' ? '<span class="tag tag-fail">YOUR FAIL</span>' : ''}
            ${q.difficulty === 'hard' ? '<span class="tag tag-hard">HARD</span>' : ''}
            ${q.difficulty === 'medium' ? '<span class="tag tag-med">MEDIUM</span>' : ''}
            ${q.difficulty === 'easy' ? '<span class="tag tag-easy">EASY</span>' : ''}
          </span>
          <span class="chevron">▶</span>
        </div>
        <div class="q-body" id="body-${q.id}">
          <div class="q-scenario">${q.scenario}</div>
          <button class="hint-btn" onclick="toggleHint('${q.id}')">📖 Show Docs Hint</button>
          <button class="answer-btn" onclick="toggleAnswer('${q.id}')">✅ Show Answer</button>
          <div class="hint-panel" id="hint-${q.id}">
            <h4>Where to find this in the docs</h4>
            <div class="hint-row"><span class="hint-label">Path:</span> <span>${q.hint.path}</span></div>
            <div class="hint-row"><span class="hint-label">URL:</span> <a href="${q.hint.url}" target="_blank">${q.hint.url}</a></div>
            <div class="hint-row"><span class="hint-label">Tip:</span> <span class="hint-search">${q.hint.tip}</span></div>
          </div>
          <div class="answer-panel" id="answer-${q.id}">
            <h4>Answer</h4>
            <div class="explanation">${q.answer.explanation}</div>
            <pre>${escapeHtml(q.answer.yaml)}</pre>
          </div>
          <div class="mark-row">
            <button class="mark-known" onclick="markCard('${q.id}','known')">✅ Got it</button>
            <button class="mark-review" onclick="markCard('${q.id}','review')">🔄 Need more practice</button>
            <span class="mark-status">${statusText}</span>
          </div>
        </div>
      </div>`;
    });
  }
  main.innerHTML = html;
}
