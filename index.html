<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K8s Practice</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3248;
    --accent: #326CE5;
    --accent2: #5b8df5;
    --green: #2ecc71;
    --red: #e74c3c;
    --yellow: #f39c12;
    --text: #e2e8f0;
    --muted: #8892a4;
    --code-bg: #111318;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Layout */
  .app { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 56px 1fr; height: 100vh; }
  .topbar { grid-column: 1 / -1; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 12px; z-index: 10; }
  .topbar h1 { font-size: 15px; font-weight: 700; color: var(--accent2); }
  .topbar .k8s-logo { font-size: 20px; }
  .topbar .score-badge { margin-left: auto; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px; font-size: 12px; color: var(--muted); }
  .topbar .score-badge span { color: var(--green); font-weight: 700; }

  /* Sidebar */
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 0; }
  .sidebar-section { padding: 6px 16px 4px; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }
  .topic-btn { display: flex; align-items: center; width: 100%; padding: 8px 16px; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 13px; text-align: left; gap: 8px; transition: all .15s; }
  .topic-btn:hover { background: var(--surface2); color: var(--text); }
  .topic-btn.active { background: rgba(50,108,229,.15); color: var(--accent2); border-right: 2px solid var(--accent); }
  .topic-btn .count { margin-left: auto; font-size: 11px; background: var(--surface2); border-radius: 10px; padding: 1px 7px; }
  .topic-btn.active .count { background: rgba(50,108,229,.3); color: var(--accent2); }
  .progress-mini { height: 3px; background: var(--border); border-radius: 2px; margin: 0 16px 8px; overflow: hidden; }
  .progress-mini-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
  .failed-badge { font-size: 9px; background: rgba(231,76,60,.2); color: var(--red); border-radius: 3px; padding: 1px 5px; font-weight: 700; }

  /* Main */
  .main { overflow-y: auto; padding: 24px; }
  .topic-header { margin-bottom: 20px; }
  .topic-header h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .topic-header .docs-link { font-size: 12px; color: var(--accent2); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .topic-header .docs-link:hover { text-decoration: underline; }
  .topic-header .subtitle { font-size: 13px; color: var(--muted); margin-top: 4px; }

  /* Docs Nav panel */
  .docs-nav { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; }
  .docs-nav h3 { font-size: 12px; font-weight: 700; color: var(--accent2); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 10px; }
  .docs-nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .docs-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  .docs-item .path { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
  .docs-item a { font-size: 12px; color: var(--accent2); text-decoration: none; }
  .docs-item a:hover { text-decoration: underline; }
  .docs-item .search-tip { font-size: 10px; color: var(--muted); margin-top: 3px; font-style: italic; }

  /* Question cards */
  .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
  .q-card.failed { border-left: 3px solid var(--red); }
  .q-card.known { border-left: 3px solid var(--green); opacity: .6; }
  .q-header { padding: 14px 16px; display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
  .q-num { font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface2); border-radius: 4px; padding: 2px 7px; flex-shrink: 0; margin-top: 1px; }
  .q-title { flex: 1; font-size: 14px; font-weight: 600; line-height: 1.4; }
  .q-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
  .tag-fail { background: rgba(231,76,60,.2); color: var(--red); }
  .tag-hard { background: rgba(243,156,18,.15); color: var(--yellow); }
  .tag-med  { background: rgba(50,108,229,.15); color: var(--accent2); }
  .tag-easy { background: rgba(46,204,113,.15); color: var(--green); }
  .chevron { color: var(--muted); transition: transform .2s; font-size: 12px; padding-top: 2px; }
  .q-card.open .chevron { transform: rotate(90deg); }
  .q-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--border); }
  .q-card.open .q-body { display: block; }
  .q-scenario { font-size: 13px; color: var(--text); line-height: 1.65; padding: 12px 0 10px; }
  .q-scenario code { background: var(--code-bg); border: 1px solid var(--border); padding: 1px 5px; border-radius: 3px; font-family: var(--font-mono); font-size: 12px; color: #a8d8ea; }

  /* Hint panel */
  .hint-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--accent); color: var(--accent2); border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; margin-bottom: 8px; transition: all .15s; }
  .hint-btn:hover { background: rgba(50,108,229,.15); }
  .hint-panel { background: #0d1a3a; border: 1px solid var(--accent); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; display: none; }
  .hint-panel.show { display: block; }
  .hint-panel h4 { font-size: 11px; font-weight: 700; color: var(--accent2); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px; }
  .hint-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; font-size: 12px; }
  .hint-label { color: var(--muted); min-width: 70px; flex-shrink: 0; }
  .hint-row a { color: var(--accent2); text-decoration: none; word-break: break-all; }
  .hint-row a:hover { text-decoration: underline; }
  .hint-search { font-style: italic; color: #7ab3e0; }

  /* Answer panel */
  .answer-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(46,204,113,.1); border: 1px solid var(--green); color: var(--green); border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; margin-bottom: 8px; margin-left: 8px; transition: all .15s; }
  .answer-btn:hover { background: rgba(46,204,113,.2); }
  .answer-panel { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; display: none; }
  .answer-panel.show { display: block; }
  .answer-panel h4 { font-size: 11px; font-weight: 700; color: var(--green); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 10px; }
  .answer-panel .explanation { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
  .answer-panel .explanation .highlight { color: var(--yellow); font-weight: 700; }
  pre { font-family: var(--font-mono); font-size: 11.5px; line-height: 1.6; color: #cdd6f4; overflow-x: auto; white-space: pre; }
  .yaml-comment { color: #6c7086; }
  .yaml-key { color: #89b4fa; }
  .yaml-val { color: #a6e3a1; }
  .yaml-str { color: #f5c2e7; }
  .yaml-important { color: #f38ba8; font-weight: 700; }

  /* Mark buttons */
  .mark-row { display: flex; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .mark-known { background: rgba(46,204,113,.1); border: 1px solid var(--green); color: var(--green); border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .mark-known:hover { background: rgba(46,204,113,.25); }
  .mark-review { background: rgba(243,156,18,.1); border: 1px solid var(--yellow); color: var(--yellow); border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .mark-review:hover { background: rgba(243,156,18,.2); }
  .mark-status { font-size: 11px; color: var(--muted); margin-left: auto; align-self: center; }

  /* Home / overview */
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .overview-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; cursor: pointer; transition: all .15s; }
  .overview-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .overview-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
  .overview-card .oc-meta { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
  .overview-card .oc-progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .overview-card .oc-fill { height: 100%; border-radius: 2px; transition: width .3s; }
  .overview-card .oc-stats { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .alert-box { background: rgba(231,76,60,.1); border: 1px solid rgba(231,76,60,.4); border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 13px; line-height: 1.6; }
  .alert-box strong { color: var(--red); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); border-radius: 20px; padding: 5px 13px; font-size: 12px; cursor: pointer; transition: all .15s; }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: rgba(50,108,229,.2); border-color: var(--accent); color: var(--accent2); }

  /* Phosphor icons, nified styling so they replace the rainbow of emojis */
  .ph { vertical-align: -0.12em; line-height: 1; flex-shrink: 0; }
  .topic-btn .ph { font-size: 16px; color: inherit; }
  .topic-header h2 .ph { font-size: 22px; color: var(--accent2); margin-right: 6px; vertical-align: -0.18em; }
  .overview-card h3 .ph { font-size: 18px; color: var(--accent2); margin-right: 6px; vertical-align: -0.18em; }
  .docs-nav h3 .ph { font-size: 14px; margin-right: 4px; }
  .docs-item .ph { font-size: 12px; vertical-align: -0.1em; }
  .hint-btn .ph, .answer-btn .ph, .mark-known .ph, .mark-review .ph { font-size: 14px; margin-right: 2px; }
  .alert-box .ph { font-size: 14px; margin-right: 4px; vertical-align: -0.18em; }
  .section-header .ph { font-size: 16px; margin-right: 6px; vertical-align: -0.18em; }
  .chevron.ph { font-size: 14px; }
  .empty-state .ph { font-size: 40px; color: var(--green); }
  .mark-status .ph { font-size: 12px; margin-right: 3px; }
</style>
</head>

  <!-- Main -->
  <main class="main" id="main">
    <!-- dynamically filled -->
  </main>
</div>

kind: CertificateSigningRequest
metadata:
  name: john-developer
spec:
  signerName: kubernetes.io/kube-apiserver-client
  request: $REQ

  - digital signature
  - key encipherment
  - client auth

  --resource=pods \\
  --verb=create,list,get,update,delete \\
  --namespace=development

kubectl create rolebinding developer-role-binding \\
  --role=developer --user=john \\

#     cpu: "150m"          <-- UNCHANGED
#     memory: "150Mi"      <-- UNCHANGED

# 4. Old RS may still exist, elete it to clear stuck pods
kubectl get rs
kubectl delete rs backend-api-7977bfdbd5

# 5. Verify
kubectl get pods                    # 3/3 Running
kubectl describe deploy backend-api | grep Limits   # limits unchanged
kubectl describe quota cpu-mem-quota                # quota unchanged`
    }
  },
  {
    id: 'cka-ts-4', topic: 'cka-troubleshoot', difficulty: 'medium',
    title: 'PVC stuck Pending, fix size/selector mismatch without altering the PV',
    scenario: `A deployment <code>alpha-mysql</code> in namespace <code>alpha</code> has pods stuck in Pending. There's a PV <code>alpha-pv</code> already created. The pods should mount it at <code>/var/lib/mysql</code> with env <code>MYSQL_ALLOW_EMPTY_PASSWORD=1</code>. <strong>Do NOT alter the PV.</strong>`,
    hint: {
      url: 'https://kubernetes.io/docs/concepts/storage/persistent-volumes/#binding',
      path: 'Concepts → Storage → Persistent Volumes → Binding',
      tip: 'PVCs bind to PVs only when storage size, accessModes, and (if present) selector labels all match. kubectl describe pvc shows the binding error. Fix the PVC (or the deployment\'s PVC ref / volume mount), ever touch the PV.'
    },
    answer: {
      explanation: `Binding requires: PVC.requests.storage ≤ PV.capacity, accessModes overlap, and PVC.selector matches PV.labels (when set). Adjust the PVC, not the PV.`,
      yaml: `# 1. See what the PV exposes
kubectl get pv alpha-pv -o yaml
# Note: capacity, accessModes, labels (if any), storageClassName

# 2. See why the PVC isn't binding
kubectl describe pvc -n alpha
# "no PV available" usually means storage size or selector mismatch

# 3. Edit the PVC to match the PV
kubectl edit pvc <pvc-name> -n alpha
# Common fixes:
#   spec.resources.requests.storage: <= PV capacity (e.g. 500Mi instead of 1Gi)
#   spec.accessModes: overlap with PV (e.g. ReadWriteOnce)
#   spec.selector.matchLabels: match PV's labels exactly
#   spec.storageClassName: must match (often "" / manual / standard)

# 4. Make sure the deployment has the env + volume mount
kubectl edit deploy alpha-mysql -n alpha
# spec.template.spec.containers[].env:
# - name: MYSQL_ALLOW_EMPTY_PASSWORD
#   value: "1"
# spec.template.spec.containers[].volumeMounts:
# - name: data
#   mountPath: /var/lib/mysql

# 5. Verify
kubectl get pvc -n alpha            # Bound
kubectl get pods -n alpha           # Running`
    }
  },
];

// ────────────────────────────────────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────────────────────────────────────
let currentTopic = 'home';
let filterMode   = 'all';
const state = JSON.parse(localStorage.getItem('ckad-state') || '{}');

function saveState() {
  localStorage.setItem('ckad-state', JSON.stringify(state));
  updateScoreBadge();
  renderSidebar();
}

function markCard(id, val) {
  state[id] = val;
  saveState();
  renderMain();
}

function getTopicProgress(topicId) {
  const qs = QUESTIONS.filter(q => q.topic === topicId);
  const known = qs.filter(q => state[q.id] === 'known').length;
  return { total: qs.length, known };
}

function updateScoreBadge() {
  const known = QUESTIONS.filter(q => state[q.id] === 'known').length;
  document.getElementById('known-count').textContent = known;
  document.getElementById('total-count').textContent = QUESTIONS.length;
}

// ────────────────────────────────────────────────────────────────────────────
// RENDER SIDEBAR
// ────────────────────────────────────────────────────────────────────────────
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  // Keep static top
  const existing = sidebar.innerHTML;
  const start = existing.indexOf('<div class="sidebar-section" style="margin-top:8px">');
  const staticPart = existing.substring(0, start);

  const renderTopicBtn = (t) => {
    const prog = getTopicProgress(t.id);
    const pct  = prog.total ? Math.round(prog.known / prog.total * 100) : 0;
    const failCount = QUESTIONS.filter(q => q.topic === t.id && q.difficulty === 'fail').length;
    return `
      <button class="topic-btn ${currentTopic === t.id ? 'active' : ''}" onclick="showTopic('${t.id}')" id="nav-${t.id}">
        <i class="ph ph-${t.icon}"></i> ${t.label}
        ${failCount ? `<span class="failed-badge">FAILED ${failCount}x</span>` : ''}
        <span class="count">${prog.known}/${prog.total}</span>
      </button>
      <div class="progress-mini"><div class="progress-mini-fill" style="width:${pct}%"></div></div>`;
  };

  const ckaTopics  = TOPICS.filter(t => t.cert === 'cka');
  const ckadTopics = TOPICS.filter(t => (t.cert || 'ckad') === 'ckad');

  let html = staticPart;
  html += '<div class="sidebar-section" style="margin-top:8px">CKA</div>';
  ckaTopics.forEach(t => { html += renderTopicBtn(t); });
  html += '<div class="sidebar-section" style="margin-top:14px">CKAD</div>';
  ckadTopics.forEach(t => { html += renderTopicBtn(t); });

  sidebar.innerHTML = html;
}

// ────────────────────────────────────────────────────────────────────────────
// RENDER MAIN
// ────────────────────────────────────────────────────────────────────────────
function showTopic(id) {
  currentTopic = id;
  filterMode = 'all';
  renderSidebar();
  renderMain();
  document.getElementById('main').scrollTop = 0;
}

function renderMain() {
  const main = document.getElementById('main');
  if (currentTopic === 'home') {
    renderHome(main); return;
  }
  const topic = TOPICS.find(t => t.id === currentTopic);
  if (!topic) return;
  let qs = QUESTIONS.filter(q => q.topic === currentTopic);
  if (filterMode === 'failed')  qs = qs.filter(q => q.difficulty === 'fail');
  if (filterMode === 'unknown') qs = qs.filter(q => state[q.id] !== 'known');
  if (filterMode === 'known')   qs = qs.filter(q => state[q.id] === 'known');

  let html = `
    <div class="topic-header">
      <h2><i class="ph ph-${topic.icon}"></i> ${topic.label}</h2>
    </div>
    <div class="docs-nav">
      <h3><i class="ph ph-book-open"></i> Docs</h3>
      <div class="docs-nav-grid">`;
  topic.docLinks.forEach(dl => {
    html += `<div class="docs-item">
      <div class="path">${topic.docsPath}</div>
      <a href="${dl.url}" target="_blank"><i class="ph ph-arrow-up-right"></i> ${dl.label}</a>
      <div class="search-tip"><i class="ph ph-lightbulb"></i> ${dl.tip}</div>
    </div>`;
  });
  html += `</div></div>
    <div class="filter-row">
      <button class="filter-btn ${filterMode==='all'?'active':''}" onclick="setFilter('all')">All (${QUESTIONS.filter(q=>q.topic===currentTopic).length})</button>
      <button class="filter-btn ${filterMode==='failed'?'active':''}" onclick="setFilter('failed')" style="color:var(--red)">Failed (${QUESTIONS.filter(q=>q.topic===currentTopic&&q.difficulty==='fail').length})</button>
      <button class="filter-btn ${filterMode==='unknown'?'active':''}" onclick="setFilter('unknown')">Needs Practice (${QUESTIONS.filter(q=>q.topic===currentTopic&&state[q.id]!=='known').length})</button>
      <button class="filter-btn ${filterMode==='known'?'active':''}" onclick="setFilter('known')" style="color:var(--green)">Known ✓ (${QUESTIONS.filter(q=>q.topic===currentTopic&&state[q.id]==='known').length})</button>
    </div>`;

  if (qs.length === 0) {
    html += `<div class="empty-state"><i class="ph ph-check-circle"></i><p>No questions in this filter.</p></div>`;
  } else {
    qs.forEach((q, i) => {
      const isKnown = state[q.id] === 'known';
      const needsReview = state[q.id] === 'review';
      const statusText = isKnown ? '<i class="ph ph-check-circle"></i> Marked as known' : needsReview ? '<i class="ph ph-warning"></i> Needs review' : '';
      html += `
      <div class="q-card ${q.difficulty === 'fail' ? 'failed' : ''} ${isKnown ? 'known' : ''}" id="card-${q.id}">
        <div class="q-header" onclick="toggleCard('${q.id}')">
          <span class="q-num">Q${i+1}</span>
          <span class="q-title">${q.title}</span>
          <span class="q-meta">
            ${q.difficulty === 'fail' ? '<span class="tag tag-fail">YOUR FAIL</span>' : ''}
            ${q.difficulty === 'hard' ? '<span class="tag tag-hard">HARD</span>' : ''}
            ${q.difficulty === 'medium' ? '<span class="tag tag-med">MEDIUM</span>' : ''}
            ${q.difficulty === 'easy' ? '<span class="tag tag-easy">EASY</span>' : ''}
          </span>
          <i class="ph ph-caret-right chevron"></i>
        </div>
        <div class="q-body" id="body-${q.id}">
          <div class="q-scenario">${q.scenario}</div>
          <button class="hint-btn" onclick="toggleHint('${q.id}')"><i class="ph ph-book-open"></i> Show Docs Hint</button>
          <button class="answer-btn" onclick="toggleAnswer('${q.id}')"><i class="ph ph-check-circle"></i> Show Answer</button>
          <div class="hint-panel" id="hint-${q.id}">
            <h4>Where to find this in the docs</h4>
            <div class="hint-row"><span class="hint-label">Path:</span> <span>${q.hint.path}</span></div>
            <div class="hint-row"><span class="hint-label">URL:</span> <a href="${q.hint.url}" target="_blank">${q.hint.url}</a></div>
            <div class="hint-row"><span class="hint-label">Tip:</span> <span class="hint-search">${q.hint.tip}</span></div>
          </div>
          <div class="answer-panel" id="answer-${q.id}">
            <h4>Answer</h4>
            <div class="explanation">${q.answer.explanation}</div>
            <pre>${escapeHtml(q.answer.yaml)}</pre>
          </div>
          <div class="mark-row">
            <button class="mark-known" onclick="markCard('${q.id}','known')"><i class="ph ph-check-circle"></i> Got it</button>
            <button class="mark-review" onclick="markCard('${q.id}','review')"><i class="ph ph-arrows-clockwise"></i> Need more practice</button>
            <span class="mark-status">${statusText}</span>
          </div>
        </div>
      </div>`;
    });
  }
  main.innerHTML = html;
}

function renderHome(main) {
  const renderCard = (t) => {
    const prog = getTopicProgress(t.id);
    const pct  = prog.total ? Math.round(prog.known / prog.total * 100) : 0;
    const failCount = QUESTIONS.filter(q => q.topic === t.id && q.difficulty === 'fail').length;
    return `
      <div class="overview-card" onclick="showTopic('${t.id}')">
        <h3><i class="ph ph-${t.icon}"></i> ${t.label}</h3>
        <div class="oc-meta">${prog.total} questions${failCount ? ` · <span style="color:var(--red)">${failCount} from your fails</span>` : ''}</div>
        <div class="oc-progress"><div class="oc-fill" style="width:${pct}%;background:${pct===100?'var(--green)':'var(--accent)'}"></div></div>
        <div class="oc-stats"><span>${prog.known} known</span><span>${pct}%</span></div>
      </div>`;
  };

  const ckaTopics  = TOPICS.filter(t => t.cert === 'cka');
  const ckadTopics = TOPICS.filter(t => (t.cert || 'ckad') === 'ckad');

  let html = `
    <h3 class="section-header" style="font-size:13px; color:var(--accent2); margin:8px 0 12px; text-transform:uppercase; letter-spacing:1.2px; font-weight:700">CKA</h3>
    <div class="overview-grid">`;
  ckaTopics.forEach(t => { html += renderCard(t); });
  html += `</div>

    <h3 class="section-header" style="font-size:13px; color:var(--muted); margin:24px 0 12px; text-transform:uppercase; letter-spacing:1.2px; font-weight:700">CKAD</h3>
    <div class="overview-grid">`;
  ckadTopics.forEach(t => { html += renderCard(t); });
  html += `</div>

    <div class="docs-nav" style="margin-top:24px">
      <h3><i class="ph ph-book-open"></i> Docs Navigation</h3>
      <div class="docs-nav-grid">
        <div class="docs-item"><div class="path">Exam search strategy</div><a href="https://kubernetes.io/docs/home/" target="_blank"><i class="ph ph-arrow-up-right"></i> kubernetes.io/docs (start here)</a><div class="search-tip"><i class="ph ph-lightbulb"></i> Use Ctrl+K or the search box. Search the resource type, not the task.</div></div>
        <div class="docs-item"><div class="path">YAML scaffolding</div><a href="https://kubernetes.io/docs/reference/kubectl/generated/" target="_blank"><i class="ph ph-arrow-up-right"></i> kubectl reference (imperative commands)</a><div class="search-tip"><i class="ph ph-lightbulb"></i> Generate YAML: kubectl create X --dry-run=client -o yaml</div></div>
        <div class="docs-item"><div class="path">All resource types</div><a href="https://kubernetes.io/docs/reference/kubernetes-api/" target="_blank"><i class="ph ph-arrow-up-right"></i> Kubernetes API reference</a><div class="search-tip"><i class="ph ph-lightbulb"></i> Find exact field names and types here</div></div>
        <div class="docs-item"><div class="path">CKA: kubeadm + etcd</div><a href="https://kubernetes.io/docs/tasks/administer-cluster/" target="_blank"><i class="ph ph-arrow-up-right"></i> Tasks → Administer a Cluster</a><div class="search-tip"><i class="ph ph-lightbulb"></i> Cluster upgrades, etcd backup, kubeadm troubleshooting all live here</div></div>
      </div>
    </div>`;
  main.innerHTML = html;
}

function setFilter(mode) {
  filterMode = mode;
  renderMain();
}

function toggleCard(id) {
  const card = document.getElementById(`card-${id}`);
  card.classList.toggle('open');
}

function toggleHint(id) {
  const panel = document.getElementById(`hint-${id}`);
  panel.classList.toggle('show');
}

function toggleAnswer(id) {
  const panel = document.getElementById(`answer-${id}`);
  panel.classList.toggle('show');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ────────────────────────────────────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────────────────────────────────────
updateScoreBadge();
renderSidebar();
renderMain();
</script>
</body>
</html>
